<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Google Gemini 4-color gradient for checkmark -->
    <linearGradient id="geminiGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#4992EA"/>
      <stop offset="33%" stop-color="#E8535D"/>
      <stop offset="66%" stop-color="#DBB82D"/>
      <stop offset="100%" stop-color="#84B381"/>
    </linearGradient>
    
    <!-- Outer glow using blended gradient -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    
    <!-- Inner shadow -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.15" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Specular highlight gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Text subtle gradient overlay -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#4992EA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="1024" height="1024" fill="#121212"/>
  
  <!-- Checkmark icon group -->
  <g transform="translate(512, 380)">
    <!-- Outer glow (blended gradient at 25% opacity) -->
    <path d="M-180 -20 
             Q-140 -80, -80 -20 
             L-20 40 
             Q20 80, 60 40
             L160 -80
             Q170 -92, 175 -85
             L178 -78
             Q182 -70, 175 -65
             L70 55
             Q25 105, -25 55
             L-85 -5
             Q-145 -65, -185 -5
             L-188 2
             Q-192 10, -185 15
             Z" 
          fill="url(#geminiGradient)" 
          opacity="0.25"
          filter="url(#outerGlow)"
          transform="scale(1.08)"/>
    
    <!-- Main checkmark body with extended curved endpoints -->
    <path d="M-180 -15 
             C-150 -65, -100 -25, -60 15
             L-15 60
             C5 82, 25 70, 55 40
             L165 -85
             C172 -93, 178 -88, 182 -82
             C186 -75, 184 -68, 178 -65
             L68 65
             C28 110, -8 95, -38 60
             L-88 5
             C-138 -45, -158 -35, -188 5
             C-194 12, -192 18, -185 20
             Z" 
          fill="url(#geminiGradient)"
          filter="url(#innerShadow)"/>
    
    <!-- Micro-flares at three endpoints (tip stylization) -->
    <!-- Top-left arm flare -->
    <path d="M-188 -8 L-205 -25 L-195 -2 Z" fill="url(#geminiGradient)" opacity="0.9"/>
    <!-- Bottom curve flare -->
    <path d="M-15 65 L-25 88 L5 78 Z" fill="url(#geminiGradient)" opacity="0.9"/>
    <!-- Top-right arm flare -->
    <path d="M178 -82 L200 -95 L185 -68 Z" fill="url(#geminiGradient)" opacity="0.9"/>
    
    <!-- Specular highlight along top-left arm -->
    <path d="M-175 -10 
             Q-140 -50, -100 -15
             L-90 -5
             Q-130 -40, -170 -5
             Z" 
          fill="url(#highlightGrad)"
          opacity="0.6"/>
  </g>
  
  <!-- Green prompt symbol -->
  <text x="305" y="720" 
        font-family="SF Mono, Menlo, Monaco, Consolas, monospace" 
        font-size="72" 
        font-weight="600"
        fill="#84B381"
        opacity="0.9">&gt;</text>
  
  <!-- SourceCheck text -->
  <g transform="translate(512, 720)">
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="96" 
          font-weight="700"
          letter-spacing="-0.02em"
          fill="#FFFFFF">SourceCheck</text>
    <!-- Subtle gradient overlay on text -->
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="96" 
          font-weight="700"
          letter-spacing="-0.02em"
          fill="url(#textGrad)"
          style="mix-blend-mode: overlay;">SourceCheck</text>
  </g>
</svg>